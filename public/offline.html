<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0058be" />
    <title>Offline | Dhruv Lad Portfolio</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f9f9ff; color: #151c27; font-family: system-ui, sans-serif; }
      main { max-width: 440px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 24px 0 12px; font-size: clamp(24px, 6vw, 32px); line-height: 1.2; }
      p { color: #475569; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 16px; padding: 0 22px; border-radius: 12px; background: #0058be; color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #151c27; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>The portfolio needs a connection to load the latest projects and information. Reconnect and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
